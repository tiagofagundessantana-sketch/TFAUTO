<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TF AUTO</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #050505; color: #fff; padding-bottom: 70px; }
        
        /* Estilos mantidos conforme original */
        .login-screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: #050505; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 500; padding: 30px; overflow-y: auto; }
        .login-container { width: 100%; max-width: 360px; background-color: #111; padding: 30px; border-radius: 12px; border: 1px solid #222; text-align: center; }
        .login-logo { font-size: 24px; font-weight: bold; margin-bottom: 25px; color: #fff; letter-spacing: 1px; }
        .login-logo span { color: #E50914; }
        .login-error { color: #ff6b6b; font-size: 13px; margin-bottom: 15px; display: none; font-weight: bold; }
        .login-success { color: #52b788; font-size: 13px; margin-bottom: 15px; display: none; font-weight: bold; }
        .login-link { color: #aaa; font-size: 13px; margin-top: 20px; display: block; cursor: pointer; text-decoration: underline; }
        .btn-google { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; background-color: #fff; color: #000; font-weight: bold; padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; margin-top: 15px; }
        .divider { color: #555; font-size: 12px; margin: 15px 0; display: flex; align-items: center; justify-content: center; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #222; margin: 0 10px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background-color: #111; border-bottom: 1px solid #222; }
        .header-title { font-size: 18px; font-weight: bold; color: #fff; }
        .header-title span { color: #E50914; }
        .icon { font-size: 20px; cursor: pointer; }
        .hero-card { background: linear-gradient(135deg, #111 0%, #1a1a1a 100%); padding: 20px; margin: 15px; border-radius: 12px; border: 1px solid #222; }
        .hero-label { font-size: 11px; color: #E50914; font-weight: bold; letter-spacing: 1px; }
        .hero-money { font-size: 32px; font-weight: bold; margin: 5px 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 15px; margin-bottom: 15px; }
        .dash-box { background-color: #111; padding: 15px; border-radius: 8px; border: 1px solid #222; }
        .dash-box-title { font-size: 10px; color: #888; font-weight: bold; margin-bottom: 5px; }
        .dash-box-value { font-size: 16px; font-weight: bold; }
        .section-title { font-size: 14px; font-weight: bold; padding: 15px 15px 5px 15px; color: #888; }
        .vehicle-card { display: flex; align-items: center; background-color: #111; margin: 10px 15px; padding: 15px; border-radius: 8px; border: 1px solid #222; cursor: pointer; }
        .vehicle-card.selected { border-color: #E50914; background-color: #130a0a; }
        .car-icon-box { font-size: 24px; margin-right: 15px; background-color: #222; padding: 10px; border-radius: 50%; }
        .vehicle-details { flex: 1; }
        .vehicle-name { font-size: 16px; font-weight: bold; }
        .vehicle-plate { font-size: 12px; color: #666; }
        .vehicle-km { font-size: 16px; font-weight: bold; color: #ff6b6b; }
        .btn-primary { background-color: #E50914; color: #fff; text-align: center; padding: 14px; margin: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; display: block; width: calc(100% - 30px); }
        .btn-delete { color: #ff6b6b; font-size: 11px; cursor: pointer; background: none; border: none; text-decoration: underline; }
        .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background-color: #111; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .tab-item { display: flex; flex-direction: column; align-items: center; color: #555; cursor: pointer; font-size: 11px; }
        .tab-active { color: #E50914; }
        .plus-btn { width: 44px; height: 44px; background-color: #E50914; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #fff; font-size: 24px; cursor: pointer; border: none; }
        .hidden { display: none !important; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 200; padding: 20px; }
        .modal-card { background-color: #111; width: 100%; max-width: 400px; padding: 20px; border-radius: 12px; border: 1px solid #333; }
        .input-field { width: 100%; background-color: #1a1a1a; border: 1px solid #333; padding: 12px; color: #fff; border-radius: 8px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="loginScreen" class="login-screen">
        <div class="login-container" id="box-login">
            <div class="login-logo">TF <span>AUTO</span></div>
            <input type="text" id="loginUser" class="input-field" placeholder="E-mail">
            <input type="password" id="loginPass" class="input-field" placeholder="Senha">
            <button class="btn-primary" style="width: 100%; margin: 0;" onclick="handleLogin()">Entrar</button>
            <span class="login-link" onclick="toggleAuthMode('register')">Não tem conta? Cadastre-se</span>
        </div>
        <div class="login-container hidden" id="box-register">
            <div class="login-logo">CRIAR <span>CONTA</span></div>
            <input type="text" id="regUser" class="input-field" placeholder="E-mail">
            <input type="password" id="regPass" class="input-field" placeholder="Senha (mín 6)">
            <button class="btn-primary" style="width: 100%; margin: 0; background-color: #52b788;" onclick="handleRegister()">Salvar</button>
            <span class="login-link" onclick="toggleAuthMode('login')">Já possui conta? Fazer Login</span>
        </div>
    </div>

    <div id="appScreen" class="hidden">
        <div class="header">
            <div class="header-title" id="headerTitle">Dashboard</div>
            <span class="icon" onclick="handleLogout()">🚪</span>
        </div>

        <div id="sec-Inicio" class="view-section">
            <div class="hero-card">
                <div class="hero-label">GASTO TOTAL</div>
                <div class="hero-money" id="dashTotalValue">R$ 0,00</div>
            </div>
            <div class="section-title">Seus Veículos</div>
            <div id="vehiclesListContainer"></div>
        </div>

        <div class="bottom-bar">
            <div class="tab-item tab-active" id="tab-Inicio" onclick="switchScreen('Inicio')">🏠 Início</div>
            <button class="plus-btn" onclick="toggleVehicleModal(true)">+</button>
            <div class="tab-item" onclick="handleLogout()">🚪 Sair</div>
        </div>
    </div>

    <div class="modal" id="vehicleModal">
        <div class="modal-card">
            <div style="color:#fff; margin-bottom:15px; font-weight:bold;">Adicionar Veículo</div>
            <input type="text" id="v-name" class="input-field" placeholder="Modelo">
            <input type="text" id="v-plate" class="input-field" placeholder="Placa">
            <input type="number" id="v-km" class="input-field" placeholder="Km Atual">
            <button class="btn-primary" style="width:100%; margin: 0 0 10px 0;" onclick="saveVehicle()">Salvar</button>
            <button class="btn-primary" style="width:100%; margin: 0; background-color: #333;" onclick="toggleVehicleModal(false)">Voltar</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, query, where, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC_ZTv39fdlUxaYlkeCc_xd-uAMGE7jXSY",
            authDomain: "tf-auto-bdd5b.firebaseapp.com",
            projectId: "tf-auto-bdd5b",
            storageBucket: "tf-auto-bdd5b.appspot.com",
            messagingSenderId: "933309363226",
            appId: "1:933309363226:web:55fab3d03a6172b5714da3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let vehicles = [];
        let selectedVehicleIndex = 0;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById("loginScreen").classList.add("hidden");
                document.getElementById("appScreen").classList.remove("hidden");
                loadUserData();
            } else {
                document.getElementById("appScreen").classList.add("hidden");
                document.getElementById("loginScreen").classList.remove("hidden");
            }
        });

        window.loadUserData = async function() {
            if (!currentUser) return;
            const q = query(collection(db, "vehicles"), where("userId", "==", currentUser.uid));
            const snap = await getDocs(q);
            vehicles = [];
            snap.forEach(d => vehicles.push({ docId: d.id, ...d.data() }));
            renderVehicles();
        }

        window.renderVehicles = function() {
            const container = document.getElementById("vehiclesListContainer");
            container.innerHTML = "";
            vehicles.forEach((car, index) => {
                container.innerHTML += `
                    <div class="vehicle-card">
                        <div class="car-icon-box">🚗</div>
                        <div class="vehicle-details">
                            <div class="vehicle-name">${car.name}</div>
                            <div class="vehicle-plate">${car.plate}</div>
                        </div>
                        <div style="text-align:right">
                            <div class="vehicle-km">${car.km} km</div>
                            <button class="btn-delete" onclick="event.stopPropagation(); deleteVehicle('${car.docId}')">Excluir</button>
                        </div>
                    </div>
                `;
            });
        }

        window.deleteVehicle = async function(docId) {
            if(confirm("Excluir este veículo permanentemente?")) {
                try {
                    await deleteDoc(doc(db, "vehicles", docId));
                    loadUserData();
                } catch (e) { alert("Erro ao excluir"); }
            }
        }

        window.saveVehicle = async function() {
            const name = document.getElementById("v-name").value;
            const plate = document.getElementById("v-plate").value;
            const km = document.getElementById("v-km").value;
            if(!name || !plate) return;
            await addDoc(collection(db, "vehicles"), { userId: currentUser.uid, name, plate, km: parseInt(km) });
            toggleVehicleModal(false);
            loadUserData();
        }

        window.handleLogin = () => signInWithEmailAndPassword(auth, document.getElementById("loginUser").value, document.getElementById("loginPass").value);
        window.handleRegister = () => createUserWithEmailAndPassword(auth, document.getElementById("regUser").value, document.getElementById("regPass").value);
        window.handleLogout = () => signOut(auth);
        window.toggleVehicleModal = (show) => document.getElementById("vehicleModal").style.display = show ? "flex" : "none";
        window.toggleAuthMode = (m) => {
            document.getElementById("box-login").classList.toggle("hidden");
            document.getElementById("box-register").classList.toggle("hidden");
        };
        window.switchScreen = (s) => console.log("Screen:", s);
    </script>
</body>
</html>
